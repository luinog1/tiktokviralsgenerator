# Render Blueprint — ViralPost Studio
# https://render.com/docs/blueprint-spec
#
# Como usar:
# 1. Garanta que este arquivo, o Dockerfile e todo o código do projeto
#    estão na RAIZ do repositório GitHub (não dentro de uma subpasta).
# 2. No Render: New → Blueprint → selecione o repositório.
# 3. O Render vai ler este arquivo e criar o serviço automaticamente.
#
# IMPORTANTE: Variáveis marcadas com `sync: false` NÃO são sincronizadas
# com o repo — você DEVE preenchê-las no painel Environment do Render.
# Variáveis com `value:` são defaults aplicados pelo Blueprint.

services:
  - type: web
    name: viralpost-studio
    runtime: docker
    plan: free
    # Render descobre o Dockerfile automaticamente se estiver na raiz.
    # Se você tiver os arquivos dentro de uma subpasta no repo, descomente
    # a linha abaixo apontando para o caminho correto:
    # rootDir: .
    dockerfilePath: ./Dockerfile
    # Porta que o container expõe (definida no Dockerfile)
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- Aplicação ---
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true  # Render gera um secret seguro automaticamente

      # --- LLM (OpenAI-compatible: Groq, OpenAI, Ollama) ---
      # IMPORTANTE: mude para "openai_compatible" no painel Environment
      # quando tiver preenchido LLM_API_KEY e LLM_API_BASE_URL.
      # Default mock = sem chamada ao LLM, divisão determinística do texto.
      - key: LLM_PROVIDER
        sync: false  # ← defina no painel como "openai_compatible"
      - key: LLM_API_BASE_URL
        sync: false  # ← ex: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false  # ← ex: gsk_xxxxxxxxxxxxx
      - key: LLM_MODEL
        sync: false  # ex: qwen/qwen3.6-27b, llama-3.3-70b-versatile, etc.
      - key: RANKING_ENABLED
        value: "true"

      # --- Vision / VLM (opcional) — ranking OLHANDO a foto ---
      # Liga o casting por visão: o modelo diz o assunto de cada foto
      # (woman/man/person/scene), e é isso que reserva o slide 1 para uma
      # pessoa. Desligado aqui, o casting ainda funciona pelo metadado da foto
      # e pela busca separada — só com menos precisão.
      #
      # ModelScope API-Inference (tier gratuito, conta vinculada à Alibaba):
      #   VISION_API_BASE_URL = https://api-inference.modelscope.cn/v1
      #   VISION_API_KEY      = ms-xxxxxxxx
      #   VISION_MODEL        = Qwen/Qwen3-VL-235B-A22B-Instruct
      #
      # ATENÇÃO ao ID do modelo: no ModelScope ele é namespaced por organização.
      # Sem o prefixo "Qwen/" a resposta é 404 e a aplicação cai silenciosamente
      # no ranking textual. Confira em /health → vision_diagnostic.
      - key: VISION_ENABLED
        sync: false  # ← "true" no painel quando a chave estiver preenchida
      - key: VISION_API_BASE_URL
        sync: false  # ← ex: https://api-inference.modelscope.cn/v1
      - key: VISION_API_KEY
        sync: false  # ← ex: ms-xxxxxxxx
      - key: VISION_MODEL
        sync: false  # ← ex: Qwen/Qwen3-VL-235B-A22B-Instruct

      # --- Casting de imagens por papel do slide ---
      # A imagem 1 (hook) recebe uma foto com pessoa; as demais, cenário.
      # "off" desliga e volta à rotação simples de imagens.
      - key: HOOK_SUBJECT
        value: woman
      # Ajuste fino das duas buscas de imagem, se quiser outro visual.
      # Ambas têm default no código — declare aqui só para mudar:
      #   HOOK_QUERY_HINTS   → termos da busca do slide 1  (default: retrato)
      #   SCENE_QUERY_HINTS  → termos das demais           (default: estética,
      #                        viagem, comida)
      # Idem RANKING_API_BASE_URL / RANKING_API_KEY / RANKING_MODEL, que
      # herdam de LLM_* quando vazias.

      # --- Pinterest ---
      - key: PINTEREST_ACCESS_TOKEN
        sync: false  # ← defina no painel
      - key: PINTEREST_API_BASE_URL
        value: https://api.pinterest.com/v5

      # --- Unsplash (fallback de imagens, gratuito e sem aprovação) ---
      # Sem PINTEREST_ACCESS_TOKEN nem UNSPLASH_ACCESS_KEY o carrossel sai
      # com gradientes mock. Confirme em /health → providers.images
      - key: UNSPLASH_ACCESS_KEY
        sync: false  # ← Access Key de https://unsplash.com/oauth/applications

      # --- HTTP / Sessão ---
      - key: SESSION_TTL_MINUTES
        value: "60"
      # 30s basta para o LLM de texto. Com VISION_ENABLED=true a chamada do VLM
      # acontece dentro do POST /generate e é bem mais lenta — suba para ~60,
      # senão o timeout derruba a visão e o carrossel sai no ranking textual.
      - key: REQUEST_TIMEOUT_SECONDS
        value: "60"

      # --- Composição de imagem ---
      - key: SLIDE_WIDTH
        value: "1080"
      - key: SLIDE_HEIGHT
        value: "1350"
